<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolveOn Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-5xl mx-auto space-y-8">
        
        <!-- Header & Status -->
        <div class="flex justify-between items-center border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-cyan-400">SolveOn Admin Control Panel</h1>
                <p class="text-xs text-slate-400 mt-1">Manage both Tasks and Leaderboard in real-time</p>
            </div>
            <span id="sync-status" class="px-3 py-1 bg-yellow-500/20 text-yellow-400 text-sm rounded-full border border-yellow-500/30">Connecting to Firebase...</span>
        </div>

        <!-- 1. TASKS MANAGEMENT SECTION -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Add Task Form -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
                <h2 class="text-lg font-semibold text-cyan-300">📌 Add New Task</h2>
                <form id="task-form" class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Task Title</label>
                        <input type="text" id="t-title" required placeholder="e.g. Solve Array Problem" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Category / Group</label>
                        <input type="text" id="t-category" required placeholder="e.g. Data Structures" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Task Link / Description</label>
                        <input type="text" id="t-link" required placeholder="e.g. https://leetcode.com/..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm focus:outline-none focus:border-cyan-500">
                    </div>
                    <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2 rounded text-sm transition">Publish Task</button>
                </form>
            </div>

            <!-- Task List Display -->
            <div class="md:col-span-2 bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
                <h2 class="text-lg font-semibold text-cyan-300">Live Active Tasks</h2>
                <div id="tasks-container" class="space-y-2 max-h-[300px] overflow-y-auto pr-2">
                    <p class="text-sm text-slate-500">Loading tasks...</p>
                </div>
            </div>
        </div>

        <!-- 2. LEADERBOARD SECTION -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-6">
            <h2 class="text-lg font-semibold text-cyan-300">🏆 Student Leaderboard Management</h2>
            
            <!-- Student Form -->
            <form id="student-form" class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-slate-900 p-4 rounded-lg border border-slate-700/50">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Student Name</label>
                    <input type="text" id="s-name" required class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Student ID</label>
                    <input type="text" id="s-id" required class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Class / Group</label>
                    <input type="text" id="s-group" required class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Points</label>
                    <input type="number" id="s-points" required class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <div class="md:col-span-4 flex justify-end">
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-6 py-2 rounded text-sm transition">Save Student</button>
                </div>
            </form>

            <!-- Leaderboard Table View -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900 text-xs text-cyan-400 uppercase">
                        <tr>
                            <th class="p-3">Rank</th>
                            <th class="p-3">Student</th>
                            <th class="p-3">ID</th>
                            <th class="p-3">Group</th>
                            <th class="p-3">Points</th>
                            <th class="p-3">Action</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <tr><td colspan="6" class="p-4 text-center text-slate-500">Loading live students...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // Corrected Project ID: solveon-e0cf4
        const firebaseConfig = {
            apiKey: "AIzaSyD6F7Y16vDy20HAlP2NFTXsz37_o8l_VZQ",
            authDomain: "solveon-e0cf4.firebaseapp.com",
            projectId: "solveon-e0cf4",
            storageBucket: "solveon-e0cf4.firebasestorage.app",
            messagingSenderId: "662833382074",
            appId: "1:662833382074:web:a409e20c8c2b34669d3883",
            measurementId: "G-Z59CBFNBM7"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let studentsList = [];
        let tasksList = [];

        // Real-time Firestore Listener
        db.collection("solveon").doc("mainData")
            .onSnapshot((doc) => {
                const statusEl = document.getElementById("sync-status");
                statusEl.className = "px-3 py-1 bg-green-500/20 text-green-400 text-sm rounded-full border border-green-500/30";
                statusEl.innerText = "● Live Firestore Connected";

                if (doc.exists) {
                    const data = doc.data();
                    studentsList = data.students || [];
                    tasksList = data.tasks || [];
                } else {
                    studentsList = [];
                    tasksList = [];
                }

                renderLeaderboard();
                renderTasks();
            }, (error) => {
                console.error("Firestore Error:", error);
                const statusEl = document.getElementById("sync-status");
                statusEl.className = "px-3 py-1 bg-red-500/20 text-red-400 text-sm rounded-full border border-red-500/30";
                statusEl.innerText = "❌ Permission or Connection Error";
            });

        // 1. Render Leaderboard Table
        function renderLeaderboard() {
            const tbody = document.getElementById("leaderboard-body");
            if (studentsList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500">No students added yet.</td></tr>`;
                return;
            }

            const sorted = [...studentsList].sort((a, b) => Number(b.points) - Number(a.points));

            tbody.innerHTML = sorted.map((st, idx) => `
                <tr class="border-b border-slate-700/50 hover:bg-slate-700/30">
                    <td class="p-3 font-bold text-cyan-400">#${idx + 1}</td>
                    <td class="p-3 font-medium text-white">${st.name}</td>
                    <td class="p-3">${st.id}</td>
                    <td class="p-3">${st.group}</td>
                    <td class="p-3 font-semibold text-emerald-400">${st.points}</td>
                    <td class="p-3">
                        <button onclick="deleteStudent('${st.id}')" class="text-xs bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-2 py-1 rounded transition">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        // 2. Render Tasks List
        function renderTasks() {
            const container = document.getElementById("tasks-container");
            if (tasksList.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-500">No active tasks created yet.</p>`;
                return;
            }

            container.innerHTML = tasksList.map((t, idx) => `
                <div class="flex items-center justify-between p-3 bg-slate-900 border border-slate-700/60 rounded-lg">
                    <div>
                        <span class="text-xs text-cyan-400 font-semibold uppercase">[${t.category}]</span>
                        <h4 class="text-sm font-medium text-white">${t.title}</h4>
                        <a href="${t.link}" target="_blank" class="text-xs text-slate-400 hover:underline truncate block max-w-md">${t.link}</a>
                    </div>
                    <button onclick="deleteTask(${idx})" class="text-xs bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-2.5 py-1 rounded transition">Remove</button>
                </div>
            `).join('');
        }

        // Save Student
        document.getElementById("student-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = document.getElementById("s-id").value.trim();
            const name = document.getElementById("s-name").value.trim();
            const group = document.getElementById("s-group").value.trim();
            const points = Number(document.getElementById("s-points").value);

            const existingIndex = studentsList.findIndex(s => s.id === id);
            if (existingIndex > -1) {
                studentsList[existingIndex] = { id, name, group, points };
            } else {
                studentsList.push({ id, name, group, points });
            }

            await syncToFirestore("Student saved successfully!");
            document.getElementById("student-form").reset();
        });

        // Add Task
        document.getElementById("task-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document.getElementById("t-title").value.trim();
            const category = document.getElementById("t-category").value.trim();
            const link = document.getElementById("t-link").value.trim();

            tasksList.push({ title, category, link, createdAt: new Date().toISOString() });

            await syncToFirestore("Task published successfully!");
            document.getElementById("task-form").reset();
        });

        // Delete Student
        async function deleteStudent(id) {
            if (!confirm("Delete this student?")) return;
            studentsList = studentsList.filter(s => s.id !== id);
            await syncToFirestore("Student removed.");
        }

        // Delete Task
        async function deleteTask(index) {
            if (!confirm("Delete this task?")) return;
            tasksList.splice(index, 1);
            await syncToFirestore("Task removed.");
        }

        // Helper Sync Function
        async function syncToFirestore(msg) {
            try {
                await db.collection("solveon").doc("mainData").set({
                    students: studentsList,
                    tasks: tasksList
                }, { merge: true });
                alert("✅ " + msg);
            } catch (err) {
                alert("❌ Save error: " + err.message);
            }
        }
    </script>
</body>
</html>
